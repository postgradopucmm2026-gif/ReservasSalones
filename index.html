<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel del Decanato · Gestión de Espacios de Reuniones — PUCMM</title>
<meta name="description" content="Panel interno del Decanato de Postgrado (PUCMM) para administrar espacios de reuniones, reservas, horarios y solicitudes de estudiantes.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F44">

<!-- Favicon personalizado (SVG inline, no depende de archivos externos) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A1F44'/%3E%3Crect x='14' y='18' width='36' height='30' rx='5' fill='none' stroke='%23FFD100' stroke-width='3.5'/%3E%3Cline x1='14' y1='27' x2='50' y2='27' stroke='%23FFD100' stroke-width='3.5'/%3E%3Cline x1='22' y1='12' x2='22' y2='22' stroke='%23FFD100' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='42' y1='12' x2='42' y2='22' stroke='%23FFD100' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='37' r='5.5' fill='%23D22630'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1F44;
    --ink-dark:#050F24;
    --accent-blue:#0033A0;
    --teal:#0033A0;
    --teal-light:#E5EBF7;
    --coral:#D22630;
    --coral-dark:#A81E27;
    --coral-light:#FBE7E8;
    --yellow:#FFD100;
    --yellow-dark:#8A6D00;
    --yellow-bg:#FFF6D6;
    --bg:#EEF1F6;
    --card:#FFFFFF;
    --border:#E1E2E4;
    --text:#1A1A1A;
    --text-muted:#6B7280;
    --green:#2F7D4F;
    --green-bg:#E3F5E6;
    --red:#D22630;
    --red-bg:#FBEAEB;
    --amber:#8A6D00;
    --amber-bg:#FFF6D6;

    --aurora-teal:#3FE0C5;
    --aurora-violet:#8B7CF6;
    --glass-bg:rgba(255,255,255,0.62);
    --glass-bg-strong:rgba(255,255,255,0.8);
    --glass-border:rgba(255,255,255,0.55);
    --glass-shadow:0 8px 28px rgba(10,31,68,0.12);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;width:100%;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    position:relative;
    overflow-x:hidden;
    max-width:100vw;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans',Arial,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Fondo Aurora (fijo, con overflow propio: nunca genera scroll horizontal) ---------- */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg);}
  /* Fachada PUCMM como textura de fondo, muy tenue para no competir con las tarjetas */
  .aurora .facade{
    position:absolute;inset:0;
    background-image:var(--facade-img);
    background-size:cover;
    background-position:center 30%;
    opacity:0.07;
    filter:blur(1.5px) saturate(0.9);
    mix-blend-mode:multiply;
  }
  .aurora .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.45;will-change:transform;}
  .aurora .b1{width:50vmax;height:50vmax;background:radial-gradient(circle, var(--aurora-violet), transparent 65%);top:-22vmax;left:-14vmax;animation:driftA 24s ease-in-out infinite alternate;}
  .aurora .b2{width:44vmax;height:44vmax;background:radial-gradient(circle, var(--aurora-teal), transparent 65%);bottom:-18vmax;right:-12vmax;animation:driftB 28s ease-in-out infinite alternate;}
  .aurora .b3{width:30vmax;height:30vmax;background:radial-gradient(circle, var(--yellow), transparent 68%);top:35%;left:60%;opacity:0.3;animation:driftC 32s ease-in-out infinite alternate;}
  @keyframes driftA{ to{ transform:translate(5vmax, 6vmax) scale(1.06);} }
  @keyframes driftB{ to{ transform:translate(-7vmax, -5vmax) scale(1.04);} }
  @keyframes driftC{ to{ transform:translate(-4vmax, 5vmax) scale(0.96);} }
  @media (prefers-reduced-motion: reduce){ .aurora .blob{ animation:none !important; } }

  #app{position:relative;z-index:1;display:flex;min-height:100vh;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .sidebar-copyright{font-size:10.5px;color:rgba(255,255,255,0.4);margin-top:10px;line-height:1.5;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:linear-gradient(165deg, rgba(10,31,68,0.94) 0%, rgba(5,15,36,0.96) 100%);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-right:1px solid rgba(255,255,255,0.08);
    color:#EAF4F2;
    display:flex;
    flex-direction:column;
    padding:26px 0;
  }
  .brand{
    display:block;
    width:100%;
    background:none;
    border:none;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    padding:0 22px 22px;
    border-bottom:1px solid rgba(255,255,255,0.18);
    margin-bottom:14px;
    border-radius:0;
    outline-offset:4px;
  }
  .brand:hover .brand-title{color:var(--yellow);}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-seal{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,0.25);}
  .brand-title{
    font-family:'Work Sans',sans-serif;
    font-size:21px;
    font-weight:800;
    color:#fff;
    line-height:1.2;
  }
  .brand-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#FFD100;
    margin-top:6px;
  }
  .brand-accent{
    height:3px;width:36px;background:var(--yellow);margin-top:12px;border-radius:2px;
  }
  nav.navlist{display:flex;flex-direction:column;gap:2px;padding:0 12px;}
  .navitem{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;
    border-radius:9px;
    color:#DCE6F7;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
  }
  .navitem svg{width:18px;height:18px;flex-shrink:0;opacity:0.85;}
  .navitem:hover{background:rgba(255,255,255,0.12);}
  .navitem.active{background:var(--coral);color:#fff;}
  .navitem.active svg{opacity:1;}
  .sidebar-footer{
    margin-top:auto;
    padding:14px 22px 0;
    border-top:1px solid rgba(255,255,255,0.18);
  }
  .conn-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#B9CCEE;margin-top:14px;}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
  .conn-dot.ok{background:#FFD100;}
  .conn-dot.bad{background:#E2653E;}

  /* ---------- Main ---------- */
  main{flex:1;padding:36px 44px;max-width:1180px;}
  .page-header{margin-bottom:28px;}
  .page-title{
    font-family:'Work Sans',sans-serif;font-weight:700;
    font-size:30px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 6px;
  }
  .page-desc{color:var(--text-muted);font-size:14.5px;max-width:640px;margin:0;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 18px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--glass-bg-strong);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:var(--text);
    font-family:'Work Sans',sans-serif;
    font-size:14px;font-weight:600;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 4px 10px rgba(10,31,68,0.06);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--ink);transform:translateY(-1px);}
  .btn:active{transform:translateY(1px) scale(0.99);box-shadow:inset 0 2px 6px rgba(0,0,0,0.12);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(160deg, var(--ink) 0%, var(--ink-dark) 100%);
    border-color:var(--ink);color:#fff;
    box-shadow:0 8px 18px rgba(10,31,68,0.28), inset 0 1px 0 rgba(255,255,255,0.16);
  }
  .btn-primary:hover{background:linear-gradient(160deg, var(--ink-dark) 0%, #030a1a 100%);border-color:var(--ink-dark);}
  .btn-danger{background:var(--card);border-color:var(--red);color:var(--red);}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}

  input,select,textarea{
    font-family:'Work Sans',sans-serif;
    font-size:14px;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid rgba(10,31,68,0.14);
    background:rgba(255,255,255,0.8);
    color:var(--text);
    width:100%;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,31,68,0.12);}
  label{font-size:12.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field{margin-bottom:16px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .checkbox-group{display:flex;gap:16px;flex-wrap:wrap;}
  .checkbox-item{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text);font-weight:400;text-transform:none;letter-spacing:normal;cursor:pointer;}
  .checkbox-item input{width:auto;accent-color:var(--ink);}

  .card{
    background:var(--glass-bg);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--glass-shadow);
  }
  @media(max-width:480px){
    main{padding:20px 14px !important;}
    .card{padding:16px;border-radius:14px;}
    .field-row{grid-template-columns:1fr;}
  }

  /* ---------- Espacios grid ---------- */
  .filters-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:flex-end;}
  .filters-bar .field{margin-bottom:0;min-width:160px;}
  .spaces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .space-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    position:relative;
  }
  .space-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .space-name{font-family:'Work Sans',sans-serif;font-weight:700;font-size:18px;color:var(--ink);margin:0 0 4px;}
  .space-loc{font-size:12.5px;color:var(--text-muted);}
  .status-pill{
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:600;
    padding:4px 10px;border-radius:20px;
    white-space:nowrap;
  }
  .status-pill.free{background:var(--green-bg);color:var(--green);}
  .status-pill.busy{background:var(--red-bg);color:var(--red);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .space-meta{display:flex;gap:14px;margin:14px 0;font-size:13px;color:var(--text);}
  .space-meta span{display:flex;align-items:center;gap:5px;}
  .space-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;min-height:22px;}
  .tag{font-size:11px;background:var(--teal-light);color:var(--teal);padding:3px 9px;border-radius:20px;font-weight:600;}
  .space-actions{display:flex;gap:8px;}
  .space-icon{width:64px;height:44px;flex-shrink:0;}
  .cell-sub{font-size:11px;color:var(--text-muted);}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-muted);
    padding:0 12px 10px;
    border-bottom:2px solid var(--border);
  }
  tbody td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:#FBFAF7;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .badge.confirmada{background:var(--green-bg);color:var(--green);}
  .badge.cancelada{background:var(--red-bg);color:var(--red);}
  .badge.activo{background:var(--green-bg);color:var(--green);}
  .badge.inactivo{background:#F1F2F4;color:var(--text-muted);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-muted);
  }
  .empty-state .icon{font-size:34px;margin-bottom:10px;opacity:0.5;}

  /* ---------- Home ---------- */
  .home-hero{
    background:linear-gradient(135deg, rgba(10,31,68,0.94) 0%, rgba(5,15,36,0.96) 100%);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:34px 38px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--glass-shadow);
  }
  .home-hero::after{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,209,0,0.18), transparent 70%);
  }
  .home-hero::before{
    content:"";
    position:absolute; bottom:-60px; left:20%;
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, rgba(63,224,197,0.16), transparent 70%);
  }
  .home-hero-eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
    color:var(--yellow);font-weight:600;
  }
  .home-hero-title{
    font-family:'Work Sans',sans-serif;font-weight:800;font-size:28px;color:#fff;
    margin:10px 0 6px;
  }
  .home-hero-desc{font-size:14px;color:rgba(255,255,255,0.75);margin:0;max-width:520px;}

  .stats-row{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;
  }
  .stat-card{
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid var(--glass-border);border-radius:16px;
    padding:18px 20px;border-top:3px solid var(--yellow);
    box-shadow:var(--glass-shadow);
  }
  .stat-card:nth-child(2){border-top-color:var(--ink);}
  .stat-card:nth-child(3){border-top-color:var(--coral);}
  .stat-card:nth-child(4){border-top-color:var(--yellow-dark);}
  .stat-value{font-family:'Work Sans',sans-serif;font-weight:800;font-size:28px;color:var(--ink);line-height:1;}
  .stat-value-sm{font-size:16px;line-height:1.3;margin-top:2px;}
  .stat-label{font-size:12px;color:var(--text-muted);margin-top:6px;}
  .stat-card-wide{grid-column:span 1;}
  @media(max-width:820px){ .stats-row{grid-template-columns:repeat(2,1fr);} }

  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:760px;}
  .home-card{
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid var(--glass-border);border-radius:20px;
    padding:32px 28px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;
    transition:.18s;font-family:inherit;position:relative;
    box-shadow:var(--glass-shadow);
  }
  .home-card:hover{border-color:var(--ink);box-shadow:0 12px 30px rgba(10,31,68,0.16);transform:translateY(-3px);}
  .home-card:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .home-card-icon{
    width:52px;height:52px;border-radius:12px;
    background:linear-gradient(135deg, var(--teal-light), #fff);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    margin-bottom:6px;
  }
  .home-card-icon svg{width:26px;height:26px;}
  .home-card-title{font-family:'Work Sans',sans-serif;font-weight:700;font-size:20px;color:var(--ink);}
  .home-card-desc{font-size:13.5px;color:var(--text-muted);line-height:1.5;}
  .home-card-arrow{
    position:absolute;top:28px;right:28px;font-size:20px;color:var(--border);
    transition:.18s;
  }
  .home-card:hover .home-card-arrow{color:var(--coral);transform:translateX(4px);}

  /* ---------- Calendario (Horarios) ---------- */
  .cal-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px;}
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-month-label{font-family:'Work Sans',sans-serif;font-weight:700;font-size:16px;color:var(--ink);min-width:150px;text-align:center;}
  .cal-range{display:flex;align-items:center;gap:8px;}
  .cal-range input{width:150px;padding:7px 10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-grid-header{margin-bottom:6px;}
  .cal-headcell{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;padding:4px 0;}
  .cal-cell{
    min-height:84px;border:1px solid var(--border);border-radius:8px;padding:6px;
    cursor:pointer;background:#fff;transition:.1s;
  }
  .cal-cell:hover{border-color:var(--ink);}
  .cal-cell.empty{border:none;cursor:default;background:transparent;}
  .cal-cell.dimmed{opacity:0.35;}
  .cal-cell.selected{border-color:var(--ink);border-width:2px;background:var(--teal-light);}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);font-weight:600;}
  .cal-daynum.today{color:#fff;background:var(--coral);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
  .cal-chips{margin-top:4px;display:flex;flex-direction:column;gap:2px;}
  .cal-chip{
    font-size:10px;background:var(--teal-light);color:var(--ink);
    padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cal-more{font-size:10px;color:var(--text-muted);padding-left:3px;}
  @media(max-width:820px){
    .cal-cell{min-height:56px;}
    .cal-chip{display:none;}
    .cal-more{display:none;}
  }

  .banner{
    padding:14px 18px;border-radius:10px;font-size:13.5px;margin-bottom:20px;
    display:flex;align-items:flex-start;gap:10px;
  }
  .banner.warn{background:var(--amber-bg);color:#7A5C0A;border:1px solid #EAD9A0;}
  .banner.error{background:var(--red-bg);color:var(--red);border:1px solid #E9C7C1;}
  .banner.success{background:var(--green-bg);color:var(--green);border:1px solid #C8E6CE;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(5,15,36,0.45);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--glass-bg-strong);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:18px;padding:28px;width:100%;max-width:480px;
    max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(5,15,36,0.35);
  }
  .modal h3{font-family:'Work Sans',sans-serif;font-weight:700;font-size:20px;color:var(--ink);margin:0 0 18px;}
  .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}

  .config-box{max-width:560px;}
  .step-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;
    font-size:12px;font-weight:700;flex-shrink:0;
  }
  .step-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
  .step-list li{display:flex;gap:10px;font-size:13.5px;color:var(--text);}
  code.inline{background:var(--teal-light);color:var(--ink);padding:2px 6px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

  .section-title{font-family:'Work Sans',sans-serif;font-weight:700;font-size:19px;color:var(--ink);margin:32px 0 14px;}

  .toggle{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:4px;}
  .toggle button{
    background:transparent;border:none;padding:8px 16px;border-radius:7px;
    font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;color:var(--text-muted);
    cursor:pointer;
  }
  .toggle button.active{background:var(--ink);color:#fff;}
  .tab-badge{
    display:inline-block;background:var(--coral);color:#fff;font-size:11px;font-weight:700;
    border-radius:20px;padding:1px 7px;margin-left:4px;
  }
  .qr-box{text-align:center;padding:10px 0;}
  .qr-box img{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff;}
  .qr-link{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);
    word-break:break-all;background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:12px;
  }
  .section-title:first-child{margin-top:0;}

  @media(max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;}
    .brand{display:none;}
    nav.navlist{flex-direction:row;padding:0;}
    .sidebar-footer{display:none;}
    main{padding:24px 18px;}
  }

  /* ---------- Volante de sala reservada (imprimible 8 x 3.5 in) ---------- */
  .volante-modal{max-width:900px;}
  .volante-print-area{
    width:8in; height:3.5in;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:14px;
    position:relative;
    overflow:hidden;
    padding:0.16in 0.32in 0.5in;
    font-family:'Work Sans',Arial,sans-serif;
    margin:0 auto;
    box-sizing:border-box;
  }
  .volante-header{display:flex;align-items:center;gap:12px;}
  .volante-header img{width:0.62in;height:0.62in;border-radius:50%;flex-shrink:0;}
  .volante-header .pucmm-name{font-family:'Work Sans',sans-serif;font-weight:800;font-size:21px;color:var(--ink);line-height:1;}
  .volante-header .pucmm-sub{font-size:8.5px;color:#333;line-height:1.2;margin-top:2px;}
  .volante-header .divider{width:2px;align-self:stretch;background:var(--ink);opacity:0.8;margin:0 4px;}
  .volante-header .decanato{font-family:'Work Sans',sans-serif;font-weight:800;font-size:13px;color:var(--ink);line-height:1.2;}

  .volante-title-row{display:flex;align-items:center;gap:12px;margin:0.08in 0 0.08in;}
  .volante-title-row .line{flex:1;height:2px;background:var(--yellow);}
  .volante-title{font-family:'Work Sans',sans-serif;font-weight:800;font-size:38px;color:var(--ink);letter-spacing:1px;white-space:nowrap;}

  .volante-fecha-box{
    border:2px solid var(--ink);border-radius:9px;
    padding:7px 14px;margin-bottom:7px;
  }
  .volante-fecha-row{display:flex;align-items:center;gap:10px;}
  .volante-fecha-row + .volante-fecha-row{
    margin-top:5px;padding-top:5px;border-top:1.5px dashed var(--yellow);
  }
  .volante-fecha-box svg{width:24px;height:24px;flex-shrink:0;color:var(--ink);}
  .volante-fecha-box .bloque{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .volante-fecha-box .etiqueta{font-family:'Work Sans',sans-serif;font-weight:800;font-size:12px;color:var(--ink);white-space:nowrap;}
  .volante-fecha-box .valor{font-family:'Work Sans',sans-serif;font-weight:800;font-size:21px;color:var(--ink);white-space:nowrap;}
  .volante-fecha-box .valor-fecha{font-size:23px;}
  .volante-fecha-box .sep{width:2px;align-self:stretch;background:var(--yellow);margin:0 4px;}

  .volante-por-row{
    display:flex;align-items:center;gap:10px;padding:4px 2px;margin-bottom:4px;
  }
  .volante-por-row svg{width:24px;height:24px;flex-shrink:0;color:var(--ink);}
  .volante-por-row .etiqueta{font-family:'Work Sans',sans-serif;font-weight:800;font-size:12px;color:var(--ink);flex-shrink:0;}
  .volante-por-row .valor{font-family:'Work Sans',sans-serif;font-weight:800;font-size:27px;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .volante-footer{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--ink); color:#fff;
    display:flex; align-items:center; gap:12px;
    padding:7px 0.32in;
    border-top:2px solid var(--yellow);
    height:0.5in;
    box-sizing:border-box;
  }
  .volante-footer svg{width:26px;height:26px;flex-shrink:0;}
  .volante-footer .div2{width:2px;align-self:stretch;background:rgba(255,255,255,0.5);}
  .volante-footer .sala{font-family:'Work Sans',sans-serif;font-weight:800;font-size:16px;}

  @media print{
    body *{visibility:hidden;}
    .volante-print-area, .volante-print-area *{visibility:visible;}
    .volante-print-area{position:fixed;top:0;left:0;margin:0;border-radius:0;border-width:2px;}
    @page{size:8in 3.5in;margin:0;}
  }
</style>
</head>

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage;

async function getSetting(key) {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get(key, true);
      return (res && res.value) || '';
    }
    return window.localStorage.getItem(key) || '';
  } catch (e) { return ''; }
}
async function setSetting(key, value) {
  try {
    if (hasClaudeStorage) await window.storage.set(key, value, true);
    else window.localStorage.setItem(key, value);
  } catch (e) { /* la sesión actual igual queda con el valor en memoria */ }
}

// ============================================================
// CACHÉ LOCAL DE DATOS (por navegador, no compartida entre usuarios)
// ------------------------------------------------------------
// Guarda una copia de espacios/reservas/solicitudes en este navegador para
// que, al volver a abrir la app, se vea de inmediato lo último conocido en
// vez de una pantalla en blanco mientras se consulta el Sheet. Se marca
// como "shared=false" porque es una caché de rendimiento local, no un dato
// que deba sincronizarse entre las personas que usan la app.
const DATA_CACHE_KEY = 'cache:sheetData';
const DATA_CACHE_TTL_MS = 60000; // si tiene menos de 1 minuto, no se vuelve a consultar el Sheet al reabrir

async function getCache(key) {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get(key, false);
      return (res && res.value) || null;
    }
    return window.localStorage.getItem(key);
  } catch (e) { return null; }
}
async function setCache(key, value) {
  try {
    if (hasClaudeStorage) await window.storage.set(key, value, false);
    else window.localStorage.setItem(key, value);
  } catch (e) { /* si falla el guardado de caché, la app sigue funcionando igual */ }
}
async function loadDataFromCache() {
  const raw = await getCache(DATA_CACHE_KEY);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    STATE.spaces = parsed.spaces || [];
    STATE.reservations = parsed.reservations || [];
    STATE.solicitudes = parsed.solicitudes || [];
    STATE.eventosCSD = parsed.eventosCSD || '';
    STATE.eventosCSTI = parsed.eventosCSTI || '';
    STATE._cacheTs = parsed.ts || 0;
  } catch (e) { /* caché corrupta o de un formato viejo: se ignora */ }
}
function saveDataToCache() {
  setCache(DATA_CACHE_KEY, JSON.stringify({
    ts: Date.now(),
    spaces: STATE.spaces,
    reservations: STATE.reservations,
    solicitudes: STATE.solicitudes,
    eventosCSD: STATE.eventosCSD,
    eventosCSTI: STATE.eventosCSTI,
  }));
}

async function loadConfig() {
  STATE.apiUrl = DEFAULT_API_URL || await getSetting('config:apiUrl');
}
async function saveConfig(url) {
  STATE.apiUrl = url;
  await setSetting('config:apiUrl', url);
}
function correoEventosParaCampus(campus) {
  const c = String(campus || '').toUpperCase();
  if (c.indexOf('CSD') !== -1) return STATE.eventosCSD || '';
  if (c.indexOf('CSTI') !== -1) return STATE.eventosCSTI || '';
  return '';
}

// ============================================================
// API (Google Apps Script Web App)
// ============================================================
async function apiGet(action) {
  const res = await fetch(STATE.apiUrl + '?action=' + action + '&adminKey=' + encodeURIComponent(ADMIN_SECRET));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(payload) {
  const conLlave = Object.assign({ adminKey: ADMIN_SECRET }, payload);
  const res = await fetch(STATE.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(conLlave),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function refreshData(force) {
  if (!STATE.apiUrl) return;
  // Regla de caché: si ya tenemos datos recientes (de esta sesión o de la
  // caché del navegador) y nadie pidió forzar, no volvemos a golpear el
  // Sheet — evita recargar todo en cada apertura de la app.
  const fresco = STATE._cacheTs && (Date.now() - STATE._cacheTs) < DATA_CACHE_TTL_MS;
  if (fresco && !force) return;
  // Solo mostramos el estado "cargando" si aún no hay nada que mostrar
  // (primera carga sin caché); si ya hay datos en pantalla, se refrescan
  // en silencio para no generar parpadeos.
  const primeraCarga = STATE.spaces.length === 0 && STATE.reservations.length === 0;
  if (primeraCarga) { STATE.loading = true; render(); }
  try {
    const result = await apiGet('all');
    if (result.error) throw new Error(result.error);
    STATE.spaces = result.spaces || [];
    STATE.reservations = result.reservations || [];
    STATE.solicitudes = result.solicitudes || [];
    STATE.eventosCSD = (result.config && result.config.EventosCSD) || '';
    STATE.eventosCSTI = (result.config && result.config.EventosCSTI) || '';
    STATE.connError = null;
    STATE._cacheTs = Date.now();
    saveDataToCache();
  } catch (e) {
    STATE.connError = e.message;
  }
  STATE.loading = false;
  render();
}

// ============================================================
// HELPERS DE DATOS
// ============================================================
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function activeSpaces() {
  return STATE.spaces.filter(s => (s.Estado || 'Activo') !== 'Inactivo');
}
function isOccupiedNow(spaceName) {
  const today = todayStr(), now = nowHM();
  return STATE.reservations.some(r =>
    r.Espacio === spaceName && r.Fecha === today && r.Estado !== 'Cancelada' &&
    r.HoraInicio <= now && r.HoraFin > now
  );
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Convierte "14:00" a "2:00 pm" para mostrarlo en toda la app
function fmtHora12(hhmm) {
  if (!hhmm || typeof hhmm !== 'string' || hhmm.indexOf(':') === -1) return hhmm || '';
  const [hStr, m] = hhmm.split(':');
  let h = parseInt(hStr, 10);
  if (isNaN(h)) return hhmm;
  const ampm = h >= 12 ? 'pm' : 'am';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${m} ${ampm}`;
}
function fmtRangoHoras(inicio, fin) {
  return `${fmtHora12(inicio)} a ${fmtHora12(fin)}`;
}

// ============================================================
// ÍCONO DE SALA SEGÚN CANTIDAD DE ASIENTOS
// ============================================================
function roomIconSVG(capacityRaw) {
  const capacity = parseInt(capacityRaw, 10) || 0;
  if (capacity <= 0) {
    return `<svg viewBox="0 0 160 100" width="100%" height="100%"><rect x="55" y="35" width="50" height="30" rx="6" fill="#0A1F44" opacity="0.25"/></svg>`;
  }
  const compact = capacity <= 10;
  const CHAIR = '#5B8DEF';
  const CHAIR_DARK = '#3E6FD1';
  const TABLE = '#0A1F44';

  let topN, bottomN, leftN, rightN, tableX, tableY, tableW, tableH;

  if (compact) {
    const endN = Math.min(2, Math.max(1, Math.floor(capacity / 4)));
    leftN = endN; rightN = endN;
    const remaining = Math.max(0, capacity - endN * 2);
    topN = Math.ceil(remaining / 2);
    bottomN = Math.floor(remaining / 2);
    tableW = 62; tableH = 40;
    tableX = 80 - tableW / 2; tableY = 50 - tableH / 2;
  } else {
    leftN = 0; rightN = 0;
    topN = Math.ceil(capacity / 2);
    bottomN = Math.floor(capacity / 2);
    tableW = Math.min(128, 60 + topN * 8); tableH = 26;
    tableX = 80 - tableW / 2; tableY = 50 - tableH / 2;
  }

  const chairs = [];
  const CW = 11, CH = 15; // chair vertical (top/bottom)
  const CWR = 15, CHR = 11; // chair horizontal (left/right)
  const gap = 5;

  function rowChairs(n, y, totalW, cx) {
    if (n <= 0) return;
    const spacing = totalW / n;
    const startX = cx - totalW / 2 + spacing / 2;
    for (let i = 0; i < n; i++) {
      const x = startX + i * spacing - CW / 2;
      chairs.push(`<rect x="${x.toFixed(1)}" y="${y}" width="${CW}" height="${CH}" rx="3.5" fill="${CHAIR}" stroke="${CHAIR_DARK}" stroke-width="1"/>`);
    }
  }
  function colChairs(n, x, totalH, cy) {
    if (n <= 0) return;
    const spacing = totalH / n;
    const startY = cy - totalH / 2 + spacing / 2;
    for (let i = 0; i < n; i++) {
      const y = startY + i * spacing - CHR / 2;
      chairs.push(`<rect x="${x}" y="${y.toFixed(1)}" width="${CWR}" height="${CHR}" rx="3.5" fill="${CHAIR}" stroke="${CHAIR_DARK}" stroke-width="1"/>`);
    }
  }

  rowChairs(topN, tableY - CH - gap, tableW - 10, 80);
  rowChairs(bottomN, tableY + tableH + gap, tableW - 10, 80);
  if (compact) {
    colChairs(leftN, tableX - CWR - gap, tableH - 6, 50);
    colChairs(rightN, tableX + tableW + gap, tableH - 6, 50);
  }

  return `<svg viewBox="0 0 160 100" width="100%" height="100%">
    <rect x="${tableX}" y="${tableY}" width="${tableW}" height="${tableH}" rx="7" fill="${TABLE}"/>
    ${chairs.join('')}
  </svg>`;
}

function navItem(key, label, icon) {
  return `<button class="navitem ${STATE.view===key?'active':''}" data-nav="${key}">${icon}${label}</button>`;
}
function attachNavHandlers() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.view = btn.dataset.nav;
      render();
      // Refresca los datos del Sheet en segundo plano al cambiar de sección,
      // para que las tarjetas y tablas nunca se queden con información vieja.
      if (STATE.apiUrl && STATE.view !== 'settings') refreshData();
    });
  });
  document.getElementById('brand-home')?.addEventListener('click', () => {
    STATE.view = 'home';
    render();
    if (STATE.apiUrl) refreshData();
  });
}

function renderMain() {
  const main = document.getElementById('main');
  if (STATE.view !== 'settings' && STATE.view !== 'home' && !STATE.apiUrl) {
    main.innerHTML = onboardingView();
    document.getElementById('goto-settings')?.addEventListener('click', () => { STATE.view='settings'; render(); });
    return;

  if (STATE.view === 'home') main.innerHTML = homeView();
  else if (STATE.view === 'reservas') main.innerHTML = reservasView();
  else if (STATE.view === 'horarios') main.innerHTML = horariosView();
  else if (STATE.view === 'admin') main.innerHTML = adminView();
  else if (STATE.view === 'settings') {
    main.innerHTML = STATE.settingsUnlocked ? settingsView() : passwordGateView();
  }
  attachViewHandlers();
}

// ============================================================
function horariosView() {
  if (!STATE.calMonth) {
    const now = new Date();
    STATE.calMonth = { year: now.getFullYear(), month: now.getMonth() };
  }
  const { year, month } = STATE.calMonth;
  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  const hasRange = STATE.calRangeFrom && STATE.calRangeTo;
  const inRange = (dateStr) => !hasRange || (dateStr >= STATE.calRangeFrom && dateStr <= STATE.calRangeTo);

  // Reservas por fecha (excluye canceladas del calendario para no saturarlo de ruido)
  const porFecha = {};
  STATE.reservations.forEach(r => {
    if (r.Estado === 'Cancelada') return;
    if (!porFecha[r.Fecha]) porFecha[r.Fecha] = [];
    porFecha[r.Fecha].push(r);
  });

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = (porFecha[dateStr] || []).filter(() => inRange(dateStr));
    const dimmed = hasRange && !inRange(dateStr);
    const isToday = dateStr === todayStr();
    const isSelected = STATE.calSelectedDay === dateStr;
    const chips = evs.slice(0, 3).map(r => `<div class="cal-chip" title="${escapeHtml(r.Espacio)} · ${escapeHtml(fmtRangoHoras(r.HoraInicio, r.HoraFin))}">${escapeHtml(fmtHora12(r.HoraInicio))} ${escapeHtml(r.Espacio)}</div>`).join('');
    const more = evs.length > 3 ? `<div class="cal-more">+${evs.length - 3} más</div>` : '';
    cells += `
      <div class="cal-cell ${dimmed?'dimmed':''} ${isSelected?'selected':''}" data-day="${dateStr}">
        <div class="cal-daynum ${isToday?'today':''}">${d}</div>
        <div class="cal-chips">${chips}${more}</div>
      </div>`;
  }

  const selectedEvents = STATE.calSelectedDay ? (porFecha[STATE.calSelectedDay] || []) : [];

  return `
    <div class="page-header">
      <h1 class="page-title">Horarios</h1>
      <p class="page-desc">Calendario de reservas registradas. Selecciona un rango de fechas para filtrar, o haz clic en un día para ver el detalle.</p>
    </div>

    <div class="cal-toolbar">
      <div class="cal-nav">
        <button class="btn btn-sm" id="cal-prev">←</button>
        <span class="cal-month-label">${monthNames[month]} ${year}</span>
        <button class="btn btn-sm" id="cal-next">→</button>
      </div>
      <div class="cal-range">
        <input type="date" id="cal-range-from" value="${escapeHtml(STATE.calRangeFrom)}">
        <span style="color:var(--text-muted);">a</span>
        <input type="date" id="cal-range-to" value="${escapeHtml(STATE.calRangeTo)}">
        <button class="btn btn-sm" id="cal-apply-range">Filtrar</button>
        ${hasRange ? `<button class="btn btn-sm" id="cal-clear-range">Limpiar</button>` : ''}
      </div>
    </div>

    <div class="card" style="padding:16px;">
      <div class="cal-grid cal-grid-header">
        ${dayNames.map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
    </div>

    ${STATE.calSelectedDay ? `
    <p class="section-title">${escapeHtml(STATE.calSelectedDay)}</p>
    <div class="card" style="padding:8px 20px;">
      ${selectedEvents.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Espacio</th><th>Horario</th><th>Responsable</th><th>Motivo</th><th>Estado</th></tr></thead>
        <tbody>${selectedEvents.map(r => `
          <tr>
            <td>${escapeHtml(r.Espacio)}</td>
            <td>${escapeHtml(fmtRangoHoras(r.HoraInicio, r.HoraFin))}</td>
            <td>${escapeHtml(r.SolicitadoPor)}<br><span class="cell-sub">${escapeHtml(r.CorreoResponsable||'')} · ${escapeHtml(r.Telefono||'')}</span></td>

function renderModal() {
  const app = document.getElementById('app');
  const wrapper = document.createElement('div');
  const m = STATE.modal;
  if (m.type === 'space') {
    wrapper.innerHTML = spaceFormModal(m.data === 'new' ? null : m.data);
    app.appendChild(wrapper.firstElementChild);
    document.getElementById('space-form').addEventListener('submit', handleSpaceFormSubmit);
  } else if (m.type === 'reservation') {
    wrapper.innerHTML = reservationFormModal(m);
    app.appendChild(wrapper.firstElementChild);
    document.getElementById('reservation-form').addEventListener('submit', handleReservationFormSubmit);
    setupServicioCocinaToggle();
  } else if (m.type === 'qr') {
    wrapper.innerHTML = qrModal(m.data);
    app.appendChild(wrapper.firstElementChild);
  } else if (m.type === 'rechazo') {
    wrapper.innerHTML = rechazoModal(m.data);
    app.appendChild(wrapper.firstElementChild);
    document.getElementById('rechazo-form').addEventListener('submit', handleRejectSolicitud);
  } else if (m.type === 'volante') {
    wrapper.innerHTML = volanteModal(m.data);
    app.appendChild(wrapper.firstElementChild);
    document.getElementById('imprimir-volante-btn').addEventListener('click', () => window.print());
    document.getElementById('modal-close-secundario').addEventListener('click', closeModal);
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
}
function closeModal() { STATE.modal = null; render(); }

function fmtFechaLarga(fecha) {
  if (!fecha) return '';
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [y, m, d] = fecha.split('-').map(Number);
  return `${d} de ${meses[m-1]}`;
}

function setupServicioCocinaToggle() {
  const form = document.getElementById('reservation-form');
  if (!form) return;
  const cafeAgua = form.querySelector('[name="ServCafeAgua"]');
  const asistencia = form.querySelector('[name="ServAsistencia"]');
  const tipoServicioField = document.getElementById('tipo-servicio-field');
  const cuentaCargoField = document.getElementById('cuenta-cargo-field');
  const radiosTipo = form.querySelectorAll('[name="TipoServicio"]');

  function actualizarVisibilidad() {
    const algunServicio = cafeAgua.checked || asistencia.checked;
    tipoServicioField.style.display = algunServicio ? 'block' : 'none';
    if (!algunServicio) {
      radiosTipo.forEach(r => r.checked = false);
      cuentaCargoField.style.display = 'none';
    } else {
      const externoSeleccionado = Array.from(radiosTipo).some(r => r.value === 'Externo' && r.checked);
      cuentaCargoField.style.display = externoSeleccionado ? 'block' : 'none';
    }
  }

  cafeAgua.addEventListener('change', actualizarVisibilidad);
  asistencia.addEventListener('change', actualizarVisibilidad);
  radiosTipo.forEach(r => r.addEventListener('change', actualizarVisibilidad));

  actualizarVisibilidad(); // estado inicial correcto al editar/mover una reserva existente
}

function attachViewHandlers() {
  // Home: las tarjetas usan data-nav, ya cubierto por attachNavHandlers()

  // Reservas: abrir modal de reserva para un espacio
  document.querySelectorAll('[data-reserve-space]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.modal = { type: 'reservation', mode: 'create', preselect: btn.dataset.reserveSpace };
      render();
    });
  });

  // Reservas: mover
  document.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
      const res = STATE.reservations.find(r => r.ID === btn.dataset.move);
      STATE.modal = { type: 'reservation', mode: 'move', data: res };
      render();
    });
  });

  // Reservas: volante imprimible
  document.querySelectorAll('[data-volante]').forEach(btn => {
    btn.addEventListener('click', () => {
      const res = STATE.reservations.find(r => r.ID === btn.dataset.volante);
      STATE.modal = { type: 'volante', data: res };
      render();
    });
  });

  // Reservas: cancelar
  document.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', () => handleCancel(btn.dataset.cancel));
  });

  // Admin: agregar / editar / desactivar
  document.getElementById('add-space-btn')?.addEventListener('click', () => { STATE.modal = { type: 'space', data: 'new' }; render(); });
  document.querySelectorAll('[data-edit-space]').forEach(btn => {
    btn.addEventListener('click', () => {
      const space = STATE.spaces.find(s => s.ID === btn.dataset.editSpace);
      STATE.modal = { type: 'space', data: space };
      render();
    });
  });
  document.querySelectorAll('[data-deactivate-space]').forEach(btn => {
    btn.addEventListener('click', () => handleDeactivate(btn.dataset.deactivateSpace));
  });
  document.querySelectorAll('[data-qr-space]').forEach(btn => {
    btn.addEventListener('click', () => {
      const space = STATE.spaces.find(s => s.ID === btn.dataset.qrSpace);
      STATE.modal = { type: 'qr', data: space };
      render();
    });
  });

  // Admin: pestañas Espacios / Estudiantes
  document.querySelectorAll('[data-admin-tab]').forEach(btn => {
    btn.addEventListener('click', () => { STATE.adminTab = btn.dataset.adminTab; render(); });
  });

  // Admin: aprobar / rechazar solicitudes de estudiantes
  document.querySelectorAll('[data-approve-solicitud]').forEach(btn => {
    btn.addEventListener('click', () => handleApproveSolicitud(btn.dataset.approveSolicitud));
  });
  document.querySelectorAll('[data-reject-solicitud]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sol = STATE.solicitudes.find(s => s.ID === btn.dataset.rejectSolicitud);
      STATE.modal = { type: 'rechazo', data: sol };
      render();
    });
  });

  // Settings
  document.getElementById('save-url-btn')?.addEventListener('click', handleSaveSettings);
  document.getElementById('save-eventos-btn')?.addEventListener('click', handleSaveEventEmails);

  // Candado de Configuración
  document.getElementById('unlock-settings-btn')?.addEventListener('click', handleUnlockSettings);
  document.getElementById('settings-password-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleUnlockSettings();
  });

  // Horarios: calendario
  document.getElementById('cal-prev')?.addEventListener('click', () => {
    let { year, month } = STATE.calMonth;
    month--; if (month < 0) { month = 11; year--; }
    STATE.calMonth = { year, month };
    render();
  });
  document.getElementById('cal-next')?.addEventListener('click', () => {
    let { year, month } = STATE.calMonth;
    month++; if (month > 11) { month = 0; year++; }
    STATE.calMonth = { year, month };
    render();
  });
  document.getElementById('cal-apply-range')?.addEventListener('click', () => {
    const from = document.getElementById('cal-range-from').value;
    const to = document.getElementById('cal-range-to').value;
    STATE.calRangeFrom = from;
    STATE.calRangeTo = to;
    if (from) {
      const [y, m] = from.split('-').map(Number);
      STATE.calMonth = { year: y, month: m - 1 };
    }
    render();
  });
  document.getElementById('cal-clear-range')?.addEventListener('click', () => {
    STATE.calRangeFrom = ''; STATE.calRangeTo = '';
    render();
  });
  document.querySelectorAll('[data-day]').forEach(cell => {
    cell.addEventListener('click', () => {
      STATE.calSelectedDay = STATE.calSelectedDay === cell.dataset.day ? null : cell.dataset.day;
      render();
    });
  });
}

async function handleReservationFormSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('reservation-submit');
  const msg = document.getElementById('reservation-msg');
  const data = Object.fromEntries(new FormData(form).entries());
  Object.keys(data).forEach(k => { if (typeof data[k] === 'string') data[k] = data[k].trim(); });
  const isMove = !!data.id;

  // Defensa adicional en el cliente: el <select> de espacio no puede
  // manipularse hacia un valor que no exista en la lista real cargada del
  // Sheet. No sustituye la validación que Code.gs debe hacer server-side.
  if (!activeSpaces().some(s => s.Nombre === data.Espacio)) {
    msg.innerHTML = `<div class="banner error">El espacio seleccionado ya no existe o está inactivo. Cierra este formulario y vuelve a intentarlo.</div>`;
    return;
  }
  if (isMove && !STATE.reservations.some(r => r.ID === data.id)) {
    msg.innerHTML = `<div class="banner error">Esta reserva ya no existe. Cierra este formulario y actualiza la página.</div>`;
    return;
  }

  // Construir la etiqueta de servicio de cocina a partir de las casillas marcadas
  const cafeAgua = !!data.ServCafeAgua;
  const asistencia = !!data.ServAsistencia;
  delete data.ServCafeAgua; delete data.ServAsistencia;
  if (cafeAgua && asistencia) data.ServiciosCocina = 'Ambos servicios';
  else if (cafeAgua) data.ServiciosCocina = 'Servicio de café y agua';
  else if (asistencia) data.ServiciosCocina = 'Asistencia de cocina durante la reunión';
  else data.ServiciosCocina = '';

  // Si se pidió algún servicio, calcular a qué correo de eventos notificar,
  // según el campus del espacio seleccionado.
  let avisoSinCorreoEventos = null;
  if (data.ServiciosCocina) {
    if (!data.TipoServicio) {
      msg.innerHTML = `<div class="banner error">Indica si el servicio de cocina es interno (sin cargos) o externo (con cargos).</div>`;
      return;
    }
    if (data.TipoServicio === 'Externo' && !data.CuentaCargo) {
      msg.innerHTML = `<div class="banner error">Escribe la cuenta y el departamento a cargar para el servicio externo.</div>`;
      return;
    }
    const espacioSel = STATE.spaces.find(s => s.Nombre === data.Espacio);
    const correoEventos = espacioSel ? correoEventosParaCampus(espacioSel.Campus) : '';
    if (correoEventos) {
      data.CorreoEventos = correoEventos;
    } else {
      avisoSinCorreoEventos = `Se pidió servicio de cocina, pero no hay un correo de eventos configurado para el campus "${(espacioSel && espacioSel.Campus) || 'de este espacio'}". Ve a Configuración para agregarlo. La reserva se guardó, pero cocina no fue notificada automáticamente.`;
    }
  } else {
    data.TipoServicio = '';
    data.CuentaCargo = '';
  }

  data.action = isMove ? 'moveReservation' : 'createReservation';
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const result = await apiPost(data);
    if (result.error) {
      msg.innerHTML = `<div class="banner error">${escapeHtml(result.error)}</div>`;
      btn.disabled = false; btn.textContent = isMove ? 'Guardar cambios' : 'Confirmar reserva';
    } else {
      closeModal();
      await refreshData(true);
      if (avisoSinCorreoEventos) alert(avisoSinCorreoEventos);
      if (!isMove && SALAS_CON_VOLANTE_AUTOMATICO.includes(data.Espacio)) {
        STATE.modal = { type: 'volante', data: data };
        render();
      }
    }
  } catch (err) {
    msg.innerHTML = `<div class="banner error">No se pudo guardar: ${escapeHtml(err.message)}</div>`;
    btn.disabled = false; btn.textContent = isMove ? 'Guardar cambios' : 'Confirmar reserva';
  }
}

async function handleCancel(id) {
  if (!confirm('¿Cancelar esta reserva? Se enviará un correo de notificación al responsable.')) return;
  try {
    const reserva = STATE.reservations.find(r => r.ID === id);
    const payload = { action: 'cancelReservation', id };
    if (reserva && reserva.ServiciosCocina) {
      const espacioSel = STATE.spaces.find(s => s.Nombre === reserva.Espacio);
      const correoEventos = espacioSel ? correoEventosParaCampus(espacioSel.Campus) : '';
      if (correoEventos) payload.CorreoEventos = correoEventos;
    }
    await apiPost(payload);
    await refreshData(true);
  } catch (err) { alert('No se pudo cancelar: ' + err.message); }
}

async function handleDeactivate(id) {
  if (!confirm('¿Desactivar este espacio? Ya no aparecerá para nuevas reservas.')) return;
  try {
    await apiPost({ action: 'deleteSpace', id });
    await refreshData(true);
  } catch (err) { alert('No se pudo desactivar: ' + err.message); }
}

async function handleApproveSolicitud(id) {
  if (!confirm('¿Aprobar esta solicitud? Se creará la reserva y se notificará por correo al estudiante.')) return;
  try {
    const result = await apiPost({ action: 'aprobarSolicitud', id });
    if (result.error) { alert(result.error); return; }
    await refreshData(true);
  } catch (err) { alert('No se pudo aprobar: ' + err.message); }
}

async function handleRejectSolicitud(e) {
  e.preventDefault();
  const form = e.target;
  const msg = document.getElementById('rechazo-msg');
  const data = Object.fromEntries(new FormData(form).entries());
  Object.keys(data).forEach(k => { if (typeof data[k] === 'string') data[k] = data[k].trim(); });
  if (!STATE.solicitudes.some(s => s.ID === data.id)) {
    msg.innerHTML = `<div class="banner error">Esta solicitud ya no existe. Cierra este formulario y actualiza la página.</div>`;
    return;
  }
  if (!data.Razon) {
    msg.innerHTML = `<div class="banner error">Escribe la razón del rechazo.</div>`;
    return;
  }
  data.action = 'rechazarSolicitud';
  try {
    const result = await apiPost(data);
    if (result.error) {
      msg.innerHTML = `<div class="banner error">${escapeHtml(result.error)}</div>`;
    } else {
      closeModal();
      await refreshData(true);
    }
  } catch (err) {
    msg.innerHTML = `<div class="banner error">No se pudo rechazar: ${escapeHtml(err.message)}</div>`;
  }
}

async function handleSpaceFormSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const msg = document.getElementById('space-msg');
  const data = Object.fromEntries(new FormData(form).entries());
  Object.keys(data).forEach(k => { if (typeof data[k] === 'string') data[k] = data[k].trim(); });
  const isEdit = !!data.id;
  if (isEdit && !STATE.spaces.some(s => s.ID === data.id)) {
    msg.innerHTML = `<div class="banner error">Este espacio ya no existe. Cierra este formulario y actualiza la página.</div>`;
    return;
  }
  data.action = isEdit ? 'updateSpace' : 'addSpace';
  try {
    const result = await apiPost(data);
    if (result.error) {
      msg.innerHTML = `<div class="banner error">${escapeHtml(result.error)}</div>`;
    } else {
      closeModal();
      await refreshData(true);
    }
  } catch (err) {
    msg.innerHTML = `<div class="banner error">${escapeHtml(err.message)}</div>`;
  }
}

async function handleSaveSettings() {
  const input = document.getElementById('api-url-input');
  const msg = document.getElementById('settings-msg');
  const url = input.value.trim();
  if (!url.startsWith('https://script.google.com/')) {
    msg.innerHTML = `<div class="banner error">Esa no parece una URL válida de Apps Script.</div>`;
    return;
  }
  msg.innerHTML = `<p style="color:var(--text-muted);">Probando conexión…</p>`;
  await saveConfig(url);
  try {
    const result = await apiGet('all');
    if (result.error) throw new Error(result.error);
    STATE.spaces = result.spaces || [];
    STATE.reservations = result.reservations || [];
    STATE.solicitudes = result.solicitudes || [];
    STATE.eventosCSD = (result.config && result.config.EventosCSD) || '';
    STATE.eventosCSTI = (result.config && result.config.EventosCSTI) || '';
    STATE.connError = null;
    msg.innerHTML = `<div class="banner success">Conexión exitosa. Se encontraron ${STATE.spaces.length} espacio(s).</div>`;
  } catch (err) {
    STATE.connError = err.message;
    msg.innerHTML = `<div class="banner error">No se pudo conectar: ${escapeHtml(err.message)}</div>`;
  }
  render();
}

async function handleSaveEventEmails() {
  const csd = document.getElementById('eventos-csd-input').value.trim();
  const csti = document.getElementById('eventos-csti-input').value.trim();
  const msg = document.getElementById('eventos-msg');
  msg.innerHTML = `<p style="color:var(--text-muted);">Guardando en el Sheet…</p>`;
  try {
    const result = await apiPost({ action: 'updateConfig', EventosCSD: csd, EventosCSTI: csti });
    if (result.error) throw new Error(result.error);
    STATE.eventosCSD = csd;
    STATE.eventosCSTI = csti;
    msg.innerHTML = `<div class="banner success">Correos de eventos guardados en el Sheet. Todos los que usen la app verán este cambio.</div>`;
  } catch (err) {
    msg.innerHTML = `<div class="banner error">No se pudo guardar: ${escapeHtml(err.message)}</div>`;
  }
}

function handleUnlockSettings() {
  const input = document.getElementById('settings-password-input');
  const msg = document.getElementById('password-msg');
  if (input.value === CONFIG_PASSWORD) {
    STATE.settingsUnlocked = true;
    render();
  } else {
    msg.innerHTML = `<div class="banner error">Clave incorrecta.</div>`;
    input.value = '';
    input.focus();
  }
}

(async function init() {
  render();
  await loadConfig();
  // Pintamos de inmediato lo último que quedó guardado en este navegador
  // (si lo hay) para no mostrar una pantalla vacía mientras se consulta
  // el Sheet — el refreshData de abajo reconcilia con datos frescos.
  await loadDataFromCache();
  render();
  if (STATE.apiUrl) await refreshData();
})();
</script>
