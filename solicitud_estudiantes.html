<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Espacio — Decanato de Postgrado PUCMM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1F44;
    --ink-dark:#050F24;
    --coral:#D22630;
    --coral-dark:#A81E27;
    --yellow:#FFD100;
    --green:#2F7D4F;
    --green-bg:#E3F5E6;
    --red:#A24A3F;
    --red-bg:#FBEAEB;
    --bg:#F5F6F7;
    --card:#FFFFFF;
    --border:#E1E2E4;
    --text:#1A1A1A;
    --text-muted:#6B7280;
    --teal-light:#E5EBF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans',Arial,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{width:100%;max-width:560px;}

  .top{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-dark) 100%);
    border-radius:16px;
    padding:28px 26px 26px;
    text-align:center;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .top::after{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,209,0,0.16), transparent 70%);
  }
  .top img.logo{width:78px;height:78px;border-radius:50%;background:#fff;padding:4px;position:relative;z-index:1;}
  .top h1{
    font-family:'Work Sans',sans-serif;font-weight:800;font-size:21px;color:#fff;
    margin:14px 0 4px;position:relative;z-index:1;
  }
  .top p{font-size:12.5px;color:rgba(255,255,255,0.75);margin:0;position:relative;z-index:1;}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:24px 22px;margin-bottom:16px;
  }

  .field{margin-bottom:16px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input,select{
    font-family:'Work Sans',sans-serif;font-size:14.5px;
    padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:#fff;color:var(--text);width:100%;
  }
  input:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px;}

  .espacio-fijo{
    display:flex;align-items:center;gap:10px;
    background:var(--teal-light);border:1px solid #C9D6EE;border-radius:8px;
    padding:11px 13px;font-weight:600;color:var(--ink);font-size:14.5px;
  }
  .espacio-fijo .qr-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--yellow);color:var(--ink-dark);
    padding:2px 8px;border-radius:20px;font-weight:700;
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:13px 18px;border-radius:9px;border:none;
    background:var(--ink);color:#fff;
    font-family:'Work Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn:hover{background:var(--ink-dark);}
  .btn:disabled{background:#C7CBD1;cursor:not-allowed;}

  .disponibilidad{
    display:flex;align-items:center;gap:9px;
    padding:11px 13px;border-radius:8px;font-size:13.5px;font-weight:600;margin-bottom:16px;
  }
  .disponibilidad.ok{background:var(--green-bg);color:var(--green);}
  .disponibilidad.no{background:var(--red-bg);color:var(--red);}
  .disponibilidad.checking{background:#F1F2F4;color:var(--text-muted);}
  .disp-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}

  .banner{
    padding:12px 15px;border-radius:9px;font-size:13.5px;margin-bottom:16px;
  }
  .banner.error{background:var(--red-bg);color:var(--red);}
  .banner.success{background:var(--green-bg);color:var(--green);}

  .footer-note{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:18px;line-height:1.6;}
  .horario-info{font-size:11.5px;color:var(--text-muted);background:var(--bg);border-radius:7px;padding:9px 11px;margin:-6px 0 16px;line-height:1.5;}

  .success-screen{text-align:center;padding:20px 6px;}
  .success-icon{
    width:60px;height:60px;border-radius:50%;background:var(--green-bg);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;
  }
  .success-screen h2{font-family:'Work Sans',sans-serif;font-weight:800;font-size:20px;color:var(--ink);margin:0 0 8px;}
  .success-screen p{font-size:13.5px;color:var(--text-muted);margin:0 0 20px;line-height:1.6;}

  .loading-screen{text-align:center;padding:60px 10px;color:var(--text-muted);}
</style>
</head>

const params = new URLSearchParams(window.location.search);
const ESPACIO_FIJO = params.get('espacio') || '';

let STATE = {
  loading: true,
  spaces: [],
  connError: null,
  submitted: false,
  disponibilidad: null, // null | 'checking' | {disponible, motivo}
  ultimaConsulta: '', // para no repetir la misma llamada
};

async function apiGet(action, extraParams) {
  const u = new URL(API_URL);
  u.searchParams.set('action', action);
  if (extraParams) Object.keys(extraParams).forEach(k => u.searchParams.set(k, extraParams[k]));
  const res = await fetch(u.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function activeSpaces() {
  return STATE.spaces.filter(s => (s.Estado || 'Activo') !== 'Inactivo');
}

// ---- Reglas de horario de atención y duración máxima (igual que Code.gs) ----
const DURACION_MAXIMA_MINUTOS = 120;

function fmtHora12(hhmm) {
  if (!hhmm || hhmm.indexOf(':') === -1) return hhmm || '';
  const [hStr, m] = hhmm.split(':');
  let h = parseInt(hStr, 10);
  const ampm = h >= 12 ? 'pm' : 'am';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${m} ${ampm}`;
}

function diaSemanaLocal(fecha) {
  const partes = fecha.split('-').map(Number);
  const d = new Date(partes[0], partes[1] - 1, partes[2]);
  return d.getDay(); // 0=domingo … 6=sábado
}

function validarDuracionMaxima(horaInicio, horaFin) {
  const [h1, m1] = horaInicio.split(':').map(Number);
  const [h2, m2] = horaFin.split(':').map(Number);
  const minutos = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (minutos > DURACION_MAXIMA_MINUTOS) {
    return 'El máximo permitido por solicitud es 2 horas. Si necesitas más tiempo, envía una solicitud adicional (renovación) para el bloque siguiente.';
  }
  return null;
}

function validarHorarioAtencion(fecha, horaInicio, horaFin) {
  const dia = diaSemanaLocal(fecha);
  let apertura, cierre, etiquetaDia;
  if (dia >= 1 && dia <= 5) {
    apertura = '09:00'; cierre = '21:00'; etiquetaDia = 'de lunes a viernes';
  } else if (dia === 6) {
    apertura = '08:30'; cierre = '14:00'; etiquetaDia = 'los sábados';
  } else {
    return 'Los domingos no se reciben solicitudes de espacios.';
  }
  if (horaInicio < apertura || horaFin > cierre) {
    return 'El horario de atención ' + etiquetaDia + ' es de ' + fmtHora12(apertura) + ' a ' + fmtHora12(cierre) + '.';
  }
  return null;
}

async function cargarEspacios() {
  STATE.loading = true; render();
  try {
    const result = await apiGet('spaces');
    if (result.error) throw new Error(result.error);
    STATE.spaces = result.data || [];
    STATE.connError = null;
  } catch (e) {
    STATE.connError = e.message;
  }
  STATE.loading = false;
  render();
}

function render() {
  const app = document.getElementById('app');
  if (STATE.submitted) {
    app.innerHTML = successScreen();
    attachHandlers();
    return;
  }
  if (STATE.loading) {
    app.innerHTML = topBlock() + `<div class="loading-screen">Cargando espacios disponibles…</div>`;
    return;
  }
  app.innerHTML = topBlock() + formScreen();
  attachHandlers();
}

    </div>

}

    </div>
  `;
}

function attachHandlers() {
  document.getElementById('nueva-solicitud-btn')?.addEventListener('click', () => {
    STATE.submitted = false;
    STATE.disponibilidad = null;
    render();
  });

  const form = document.getElementById('solicitud-form');
  if (!form) return;

  form.addEventListener('submit', handleSubmit);

  const espacioSelect = document.getElementById('espacio-select');
  const fechaInput = document.getElementById('fecha-input');
  const horaInicioInput = document.getElementById('hora-inicio-input');
  const horaFinInput = document.getElementById('hora-fin-input');

  [espacioSelect, fechaInput, horaInicioInput, horaFinInput].forEach(el => {
    el?.addEventListener('change', () => checkDisponibilidad(form));
  });

  checkDisponibilidad(form); // por si ya viene todo prellenado (ej. fecha por defecto)
}

let disponibilidadTimer = null;
function checkDisponibilidad(form) {
  const espacio = form.querySelector('[name="Espacio"]')?.value;
  const fecha = form.querySelector('[name="Fecha"]')?.value;
  const horaInicio = form.querySelector('[name="HoraInicio"]')?.value;
  const horaFin = form.querySelector('[name="HoraFin"]')?.value;
  const box = document.getElementById('disponibilidad-box');
  const btn = document.getElementById('submit-btn');

  if (!espacio || !fecha || !horaInicio || !horaFin) {
    box.innerHTML = '';
    btn.disabled = true;
    STATE.disponibilidad = null;
    return;
  }
  if (horaInicio >= horaFin) {
    box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>La hora de inicio debe ser antes que la hora de fin.</div>`;
    btn.disabled = true;
    return;
  }

  const errorDuracion = validarDuracionMaxima(horaInicio, horaFin);
  if (errorDuracion) {
    box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>${escapeHtml(errorDuracion)}</div>`;
    btn.disabled = true;
    STATE.ultimaConsulta = '';
    return;
  }

  const errorHorario = validarHorarioAtencion(fecha, horaInicio, horaFin);
  if (errorHorario) {
    box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>${escapeHtml(errorHorario)}</div>`;
    btn.disabled = true;
    STATE.ultimaConsulta = '';
    return;
  }

  const clave = [espacio, fecha, horaInicio, horaFin].join('|');
  if (clave === STATE.ultimaConsulta) return; // evita repetir la misma consulta
  STATE.ultimaConsulta = clave;

  box.innerHTML = `<div class="disponibilidad checking"><span class="disp-dot"></span>Verificando disponibilidad…</div>`;
  btn.disabled = true;

  clearTimeout(disponibilidadTimer);
  disponibilidadTimer = setTimeout(async () => {
    try {
      const result = await apiGet('disponibilidad', { espacio, fecha, horaInicio, horaFin });
      if (STATE.ultimaConsulta !== clave) return; // el usuario ya cambió algo mientras esperábamos
      if (result.disponible) {
        box.innerHTML = `<div class="disponibilidad ok"><span class="disp-dot"></span>Este espacio está disponible en ese horario.</div>`;
        btn.disabled = false;
      } else {
        box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>${escapeHtml(result.motivo || 'Este salón está ocupado en ese horario.')}</div>`;
        btn.disabled = true;
      }
    } catch (err) {
      box.innerHTML = `<div class="banner error">No se pudo verificar disponibilidad: ${escapeHtml(err.message)}</div>`;
      btn.disabled = true;
    }
  }, 400); // pequeño debounce para no saturar de llamadas mientras el usuario escribe/cambia
}

async function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('solicitud-msg');
  const data = Object.fromEntries(new FormData(form).entries());
  data.action = 'crearSolicitud';

  btn.disabled = true; btn.textContent = 'Enviando…';
  msg.innerHTML = '';
  try {
    const result = await apiPost(data);
    if (result.error) {
      msg.innerHTML = `<div class="banner error">${escapeHtml(result.error)}</div>`;
      btn.disabled = false; btn.textContent = 'Enviar solicitud';
    } else {
      STATE.submitted = true;
      render();
    }
  } catch (err) {
    msg.innerHTML = `<div class="banner error">No se pudo enviar la solicitud: ${escapeHtml(err.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Enviar solicitud';
  }
}

// ============================================================
// INIT
// ============================================================
render();
cargarEspacios();
</script>
