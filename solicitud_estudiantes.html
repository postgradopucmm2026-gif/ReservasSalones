<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Solicitar sala de reuniones — Decanato de Postgrado PUCMM</title>
<meta name="description" content="Solicita en línea una sala de reuniones del Decanato de Postgrado de la PUCMM: elige espacio, fecha y horario, y recibe la confirmación por correo.">
<meta name="theme-color" content="#0A1F44">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230A1F44'/%3E%3Cstop offset='1' stop-color='%23335AC7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 14l19 8-19 8-19-8 19-8z' fill='%23FFD100'/%3E%3Cpath d='M20 27v10c0 4 5 7 12 7s12-3 12-7V27' stroke='%23FFFFFF' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1F44;
    --ink-dark:#050F24;
    --coral:#D22630;
    --coral-dark:#A81E27;
    --yellow:#FFD100;
    --green:#2F7D4F;
    --green-bg:rgba(47,125,79,0.14);
    --red:#B84C42;
    --red-bg:rgba(184,76,66,0.12);
    --bg:#EEF1F8;
    --card:rgba(255,255,255,0.6);
    --card-solid:#FFFFFF;
    --border:rgba(255,255,255,0.55);
    --text:#132043;
    --text-muted:#5C6785;
    --teal-light:rgba(51,90,199,0.10);
    --glass-shadow:0 8px 32px rgba(10,31,68,0.10), 0 1px 1px rgba(255,255,255,0.6) inset;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;width:100%;}
  body{
    background:
      radial-gradient(60% 50% at 12% 0%, rgba(255,209,0,0.30), transparent 60%),
      radial-gradient(55% 45% at 90% 8%, rgba(210,38,48,0.22), transparent 60%),
      radial-gradient(70% 60% at 50% 100%, rgba(51,90,199,0.30), transparent 60%),
      linear-gradient(180deg, #DCE3F5 0%, #EEF1F8 40%, #F4EFE4 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Work Sans',Arial,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:560px;min-width:0;}

  .top{
    display:block;
    text-decoration:none;
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-dark) 100%);
    border-radius:22px;
    padding:28px 26px 26px;
    text-align:center;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 14px 34px rgba(5,15,36,0.35);
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .top:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(5,15,36,0.4);}
  .top:active{transform:translateY(0);}
  .top::before{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(50% 60% at 20% 110%, rgba(255,209,0,0.25), transparent 70%);
  }
  .top::after{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle, rgba(210,38,48,0.28), transparent 70%);
  }
  .top .logo-mark{
    width:64px;height:64px;border-radius:18px;position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.25);
    margin:0 auto;
  }
  .top .logo-mark svg{width:36px;height:36px;}
  .top h1{
    font-family:'Work Sans',sans-serif;font-weight:800;font-size:21px;color:#fff;
    margin:14px 0 4px;position:relative;z-index:1;
  }
  .top p{font-size:12.5px;color:rgba(255,255,255,0.75);margin:0;position:relative;z-index:1;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px 22px;margin-bottom:16px;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:var(--glass-shadow);
  }

  .field{margin-bottom:16px;min-width:0;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0;}
  label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input,select{
    font-family:'Work Sans',sans-serif;font-size:14.5px;
    padding:11px 13px;border-radius:12px;border:1px solid rgba(19,32,67,0.10);
    background:#FBFCFF;color:var(--text);width:100%;max-width:100%;
    box-shadow:inset 2px 2px 5px rgba(19,32,67,0.06), inset -2px -2px 5px rgba(255,255,255,0.7);
    transition:box-shadow .15s ease;
  }
  input:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(51,90,199,0.25), inset 2px 2px 5px rgba(19,32,67,0.06);}

  .espacio-fijo{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--teal-light);border:1px solid rgba(51,90,199,0.25);border-radius:12px;
    padding:11px 13px;font-weight:600;color:var(--ink);font-size:14.5px;
  }
  .espacio-fijo .qr-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--yellow);color:var(--ink-dark);
    padding:2px 8px;border-radius:20px;font-weight:700;
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:13px 18px;border-radius:14px;border:none;
    background:linear-gradient(135deg, var(--ink) 0%, #1F3A7A 100%);
    color:#fff;
    font-family:'Work Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 18px rgba(10,31,68,0.28), inset 0 1px 0 rgba(255,255,255,0.15);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(10,31,68,0.34);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{background:#C7CBD1;cursor:not-allowed;box-shadow:none;transform:none;}

  .disponibilidad{
    display:flex;align-items:center;gap:9px;
    padding:11px 13px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:16px;
  }
  .disponibilidad.ok{background:var(--green-bg);color:var(--green);}
  .disponibilidad.no{background:var(--red-bg);color:var(--red);}
  .disponibilidad.checking{background:rgba(19,32,67,0.06);color:var(--text-muted);}
  .disp-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}

  .banner{
    padding:12px 15px;border-radius:12px;font-size:13.5px;margin-bottom:16px;
  }
  .banner.error{background:var(--red-bg);color:var(--red);}
  .banner.success{background:var(--green-bg);color:var(--green);}

  .footer-note{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:18px;line-height:1.6;}
  .horario-info{font-size:11.5px;color:var(--text-muted);background:rgba(19,32,67,0.05);border-radius:10px;padding:9px 11px;margin:-6px 0 16px;line-height:1.5;}

  .success-screen{text-align:center;padding:20px 6px;}
  .success-icon{
    width:60px;height:60px;border-radius:50%;background:var(--green-bg);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;
  }
  .success-screen h2{font-family:'Work Sans',sans-serif;font-weight:800;font-size:20px;color:var(--ink);margin:0 0 8px;}
  .success-screen p{font-size:13.5px;color:var(--text-muted);margin:0 0 20px;line-height:1.6;}

  .loading-screen{text-align:center;padding:60px 10px;color:var(--text-muted);}

  @media (max-width:480px){
    body{padding:20px 12px 44px;}
    .card{padding:18px 16px;}
    .field-row{grid-template-columns:1fr;gap:0;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ============================================================
// CONFIGURACIÓN — esta es la ÚNICA URL que necesita esta app.
// Debe ser la misma URL de Apps Script que usa la app del Decanato.
//
// IMPORTANTE (seguridad): esta URL es visible para cualquiera que abra el
// código fuente de la página, igual que TODO lo que corre en el navegador.
// No es un secreto — es la puerta pública del formulario. La seguridad real
// vive en Code.gs (backend): ahí es donde se debe revalidar el horario de
// atención, la duración máxima y la disponibilidad, sin confiar en lo que
// llegue desde este formulario, porque cualquiera puede llamar a esta URL
// directamente con una petición HTTP, sin pasar por esta página.
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyKKl28RLY9NdegZ--AY5_eQ-7F2n6HlcYZxvJfk4jYtaJNlTTnNzIISYauaVo0jBImoA/exec";

// Marca institucional en SVG (coincide con el favicon). Se usa en vez de una
// imagen base64 pesada para que el logo cargue instantáneo y sea nítido en
// cualquier resolución.
const LOGO_SVG = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M32 14l19 8-19 8-19-8 19-8z" fill="#FFD100"/>
  <path d="M20 27v10c0 4 5 7 12 7s12-3 12-7V27" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>`;

const params = new URLSearchParams(window.location.search);
const ESPACIO_FIJO = params.get('espacio') || '';

let STATE = {
  loading: true,
  spaces: [],
  connError: null,
  submitted: false,
  disponibilidad: null,
  ultimaConsulta: '',
};

async function apiGet(action, extraParams) {
  const u = new URL(API_URL);
  u.searchParams.set('action', action);
  if (extraParams) Object.keys(extraParams).forEach(k => u.searchParams.set(k, extraParams[k]));
  const res = await fetch(u.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function activeSpaces() {
  return STATE.spaces.filter(s => (s.Estado || 'Activo') !== 'Inactivo');
}

const DURACION_MAXIMA_MINUTOS = 120;

function fmtHora12(hhmm) {
  if (!hhmm || hhmm.indexOf(':') === -1) return hhmm || '';
  const [hStr, m] = hhmm.split(':');
  let h = parseInt(hStr, 10);
  const ampm = h >= 12 ? 'pm' : 'am';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${m} ${ampm}`;
}

function diaSemanaLocal(fecha) {
  const partes = fecha.split('-').map(Number);
  const d = new Date(partes[0], partes[1] - 1, partes[2]);
  return d.getDay();
}

function validarDuracionMaxima(horaInicio, horaFin) {
  const [h1, m1] = horaInicio.split(':').map(Number);
  const [h2, m2] = horaFin.split(':').map(Number);
  const minutos = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (minutos > DURACION_MAXIMA_MINUTOS) {
    return 'El máximo permitido por solicitud es 2 horas. Si necesitas más tiempo, envía una solicitud adicional (renovación) para el bloque siguiente.';
  }
  return null;
}

function validarHorarioAtencion(fecha, horaInicio, horaFin) {
  const dia = diaSemanaLocal(fecha);
  let apertura, cierre, etiquetaDia;
  if (dia >= 1 && dia <= 5) {
    apertura = '09:00'; cierre = '21:00'; etiquetaDia = 'de lunes a viernes';
  } else if (dia === 6) {
    apertura = '08:30'; cierre = '14:00'; etiquetaDia = 'los sábados';
  } else {
    return 'Los domingos no se reciben solicitudes de espacios.';
  }
  if (horaInicio < apertura || horaFin > cierre) {
    return 'El horario de atención ' + etiquetaDia + ' es de ' + fmtHora12(apertura) + ' a ' + fmtHora12(cierre) + '.';
  }
  return null;
}

async function cargarEspacios() {
  STATE.loading = true; render();
  try {
    const result = await apiGet('spaces');
    if (result.error) throw new Error(result.error);
    STATE.spaces = result.data || [];
    STATE.connError = null;
  } catch (e) {
    STATE.connError = e.message;
  }
  STATE.loading = false;
  render();
}

function render() {
  const app = document.getElementById('app');
  if (STATE.submitted) {
    app.innerHTML = successScreen();
    attachHandlers();
    return;
  }
  if (STATE.loading) {
    app.innerHTML = topBlock() + `<div class="loading-screen">Cargando espacios disponibles…</div>`;
    return;
  }
  app.innerHTML = topBlock() + formScreen();
  attachHandlers();
}

function topBlock() {
  return `
    <a href="./" class="top" id="logo-home-link" aria-label="PUCMM Decanato de Postgrado — volver al formulario">
      <div class="logo-mark">${LOGO_SVG}</div>
      <h1>Solicitud de Espacio de Reunión</h1>
      <p>Decanato de Postgrado · PUCMM</p>
    </a>
  `;
}

function formScreen() {
  const spaces = activeSpaces();
  const espacioValido = ESPACIO_FIJO && spaces.some(s => s.Nombre === ESPACIO_FIJO);

  return `
    <div class="card">
      ${STATE.connError ? `<div class="banner error">No se pudo cargar la información: ${escapeHtml(STATE.connError)}</div>` : ''}
      <form id="solicitud-form">
        <div class="field">
          <label>Espacio</label>
          ${espacioValido ? `
            <div class="espacio-fijo">
              ${escapeHtml(ESPACIO_FIJO)}
              <span class="qr-tag">Asignado por QR</span>
            </div>
            <input type="hidden" name="Espacio" value="${escapeHtml(ESPACIO_FIJO)}">
          ` : `
            <select name="Espacio" id="espacio-select" required>
              <option value="">Selecciona un espacio…</option>
              ${spaces.map(s => `<option value="${escapeHtml(s.Nombre)}">${escapeHtml(s.Nombre)} (${escapeHtml(s.Capacidad||'—')} pers.)</option>`).join('')}
            </select>
          `}
        </div>

        <div class="field">
          <label>Fecha</label>
          <input type="date" name="Fecha" id="fecha-input" required min="${todayStr()}" value="${todayStr()}">
        </div>
        <p class="horario-info">Horario de atención: lunes a viernes de 9:00 am a 9:00 pm · sábados de 8:30 am a 2:00 pm. Máximo 2 horas por solicitud — si necesitas más tiempo, envía una renovación para el siguiente bloque.</p>
        <div class="field-row">
          <div class="field">
            <label>Hora de inicio</label>
            <input type="time" name="HoraInicio" id="hora-inicio-input" required>
          </div>
          <div class="field">
            <label>Hora de fin</label>
            <input type="time" name="HoraFin" id="hora-fin-input" required>
          </div>
        </div>

        <div id="disponibilidad-box"></div>

        <div class="field">
          <label>Nombre completo</label>
          <input type="text" name="NombreCompleto" placeholder="Nombre y apellido" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>ID / Matrícula</label>
            <input type="text" name="IDEstudiante" placeholder="Ej. 2020-1234" required>
          </div>
          <div class="field">
            <label>Teléfono</label>
            <input type="tel" name="Telefono" placeholder="809-000-0000" required>
          </div>
        </div>
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" name="Correo" placeholder="nombre@est.pucmm.edu.do" required>
        </div>
        <div class="field">
          <label>Coordinador</label>
          <input type="text" name="Coordinador" placeholder="Nombre del coordinador de tu programa" required>
        </div>

        <div id="solicitud-msg"></div>
        <button type="submit" class="btn" id="submit-btn" disabled>Enviar solicitud</button>
      </form>
    </div>
    <p class="footer-note">Tu solicitud quedará pendiente de aprobación por parte del Decanato de Postgrado. Te notificaremos por correo electrónico si fue aprobada o rechazada.</p>
  `;
}

function successScreen() {
  return `
    <div class="card success-screen">
      <div class="success-icon">✓</div>
      <h2>Solicitud enviada</h2>
      <p>Tu solicitud fue registrada y quedará pendiente de aprobación por parte del Decanato de Postgrado. Te notificaremos por correo electrónico en cuanto sea aprobada o rechazada.</p>
      <button class="btn" id="nueva-solicitud-btn">Enviar otra solicitud</button>
    </div>
  `;
}

function attachHandlers() {
  document.getElementById('nueva-solicitud-btn')?.addEventListener('click', () => {
    STATE.submitted = false;
    STATE.disponibilidad = null;
    render();
  });

  document.getElementById('logo-home-link')?.addEventListener('click', (e) => {
    e.preventDefault();
    STATE.submitted = false;
    STATE.disponibilidad = null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  const form = document.getElementById('solicitud-form');
  if (!form) return;

  form.addEventListener('submit', handleSubmit);

  const espacioSelect = document.getElementById('espacio-select');
  const fechaInput = document.getElementById('fecha-input');
  const horaInicioInput = document.getElementById('hora-inicio-input');
  const horaFinInput = document.getElementById('hora-fin-input');

  [espacioSelect, fechaInput, horaInicioInput, horaFinInput].forEach(el => {
    el?.addEventListener('change', () => checkDisponibilidad(form));
  });

  checkDisponibilidad(form);
}

let disponibilidadTimer = null;
function checkDisponibilidad(form) {
  const espacio = form.querySelector('[name="Espacio"]')?.value;
  const fecha = form.querySelector('[name="Fecha"]')?.value;
  const horaInicio = form.querySelector('[name="HoraInicio"]')?.value;
  const horaFin = form.querySelector('[name="HoraFin"]')?.value;
  const box = document.getElementById('disponibilidad-box');
  const btn = document.getElementById('submit-btn');

  if (!espacio || !fecha || !horaInicio || !horaFin) {
    box.innerHTML = '';
    btn.disabled = true;
    STATE.disponibilidad = null;
    return;
  }
  if (horaInicio >= horaFin) {
    box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>La hora de inicio debe ser antes que la hora de fin.</div>`;
    btn.disabled = true;
    return;
  }

  const errorDuracion = validarDuracionMaxima(horaInicio, horaFin);
  if (errorDuracion) {
    box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>${escapeHtml(errorDuracion)}</div>`;
    btn.disabled = true;
    STATE.ultimaConsulta = '';
    return;
  }

  const errorHorario = validarHorarioAtencion(fecha, horaInicio, horaFin);
  if (errorHorario) {
    box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>${escapeHtml(errorHorario)}</div>`;
    btn.disabled = true;
    STATE.ultimaConsulta = '';
    return;
  }

  const clave = [espacio, fecha, horaInicio, horaFin].join('|');
  if (clave === STATE.ultimaConsulta) return;
  STATE.ultimaConsulta = clave;

  box.innerHTML = `<div class="disponibilidad checking"><span class="disp-dot"></span>Verificando disponibilidad…</div>`;
  btn.disabled = true;

  clearTimeout(disponibilidadTimer);
  disponibilidadTimer = setTimeout(async () => {
    try {
      const result = await apiGet('disponibilidad', { espacio, fecha, horaInicio, horaFin });
      if (STATE.ultimaConsulta !== clave) return;
      if (result.disponible) {
        box.innerHTML = `<div class="disponibilidad ok"><span class="disp-dot"></span>Este espacio está disponible en ese horario.</div>`;
        btn.disabled = false;
      } else {
        box.innerHTML = `<div class="disponibilidad no"><span class="disp-dot"></span>${escapeHtml(result.motivo || 'Este salón está ocupado en ese horario.')}</div>`;
        btn.disabled = true;
      }
    } catch (err) {
      box.innerHTML = `<div class="banner error">No se pudo verificar disponibilidad: ${escapeHtml(err.message)}</div>`;
      btn.disabled = true;
    }
  }, 400);
}

async function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('solicitud-msg');
  const data = Object.fromEntries(new FormData(form).entries());
  data.action = 'crearSolicitud';

  btn.disabled = true; btn.textContent = 'Enviando…';
  msg.innerHTML = '';
  try {
    const result = await apiPost(data);
    if (result.error) {
      msg.innerHTML = `<div class="banner error">${escapeHtml(result.error)}</div>`;
      btn.disabled = false; btn.textContent = 'Enviar solicitud';
    } else {
      STATE.submitted = true;
      render();
    }
  } catch (err) {
    msg.innerHTML = `<div class="banner error">No se pudo enviar la solicitud: ${escapeHtml(err.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Enviar solicitud';
  }
}

render();
cargarEspacios();
</script>
</body>
</html>
